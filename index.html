<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="profile.css">
    <style>
        .card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: fadeIn 0.9s ease;
        }

        /* ── Glass panel ── */
        .glass-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 77, 158, 0.14);
            border-radius: 28px;
            padding: 40px 36px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            backdrop-filter: blur(28px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 80px rgba(255, 77, 158, 0.08),
                0 24px 64px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 77, 158, 0.5), transparent);
        }

        /* ── Avatar ── */
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            position: relative;
        }

        .avatar-glow {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: var(--accent-gradient);
            opacity: 0.25;
            filter: blur(24px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        .avatar-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4d9e, #c2185b, #ff4d9e);
            animation: ringRotate 5s linear infinite;
            z-index: 1;
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--bg-primary);
        }

        .avatar-img {
            position: absolute;
            inset: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #23a55a;
            border: 3px solid var(--bg-primary);
            z-index: 3;
            box-shadow: 0 0 8px rgba(35, 165, 90, 0.6);
            animation: pulseDot 2.5s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { box-shadow: 0 0 6px rgba(35,165,90,0.5); }
            50% { box-shadow: 0 0 14px rgba(35,165,90,0.9); }
        }

        /* ── Name + bio ── */
        .name-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .name-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(120deg, #fff 20%, #ff4d9e 50%, #fff 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            animation: nameShimmer 4s linear infinite;
        }

        @keyframes nameShimmer {
            0%   { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .bio-text {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            letter-spacing: 0.01em;
            min-height: 1.2em;
        }

        .bio-text::after {
            content: '|';
            color: #ff4d9e;
            opacity: 1;
            animation: blinkCursor 0.9s step-end infinite;
            margin-left: 1px;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* ── Tags ── */
        .tags-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 13px;
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 77, 158, 0.2);
            background: rgba(255, 77, 158, 0.07);
            color: rgba(255,255,255,0.6);
            transition: var(--transition);
            animation: chipIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        .chip:nth-child(1) { animation-delay: 0.05s; }
        .chip:nth-child(2) { animation-delay: 0.12s; }
        .chip:nth-child(3) { animation-delay: 0.19s; }
        .chip:nth-child(4) { animation-delay: 0.26s; }

        @keyframes chipIn {
            from { opacity: 0; transform: translateY(8px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chip:hover {
            background: rgba(255, 77, 158, 0.15);
            border-color: rgba(255, 77, 158, 0.4);
            color: #fff;
            transform: translateY(-1px);
        }

        .chip i {
            font-size: 0.6rem;
            color: #ff4d9e;
        }

        /* ── Divider ── */
        .fancy-divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fancy-divider::before,
        .fancy-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 77, 158, 0.2));
        }

        .fancy-divider::after {
            background: linear-gradient(90deg, rgba(255, 77, 158, 0.2), transparent);
        }

        .fancy-divider span {
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 77, 158, 0.5);
            font-weight: 600;
        }

        /* ── Connect icon buttons ── */
        .connect-row {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.03);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.25s ease;
            cursor: none;
            user-select: none;
        }

        .icon-btn:active { transform: scale(0.94) !important; }

        .icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: inherit;
        }

        .icon-btn:hover { transform: translateY(-3px); }
        .icon-btn:hover::before { opacity: 1; }

        .icon-btn .icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        .icon-btn .icon-label {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        /* Discord */
        .icon-btn.discord { border-color: rgba(88, 101, 242, 0.2); }
        .icon-btn.discord::before { background: linear-gradient(145deg, rgba(88,101,242,0.12), transparent); }
        .icon-btn.discord:hover { border-color: rgba(88,101,242,0.45); box-shadow: 0 0 28px rgba(88,101,242,0.18); }
        .icon-btn.discord .icon-wrap { background: linear-gradient(135deg, #5865F2, #3b47c9); box-shadow: 0 6px 22px rgba(88,101,242,0.4); }
        .icon-btn.discord .icon-label { color: rgba(88,101,242,0.85); }

        /* Telegram */
        .icon-btn.telegram { border-color: rgba(0,136,204,0.2); }
        .icon-btn.telegram::before { background: linear-gradient(145deg, rgba(0,136,204,0.12), transparent); }
        .icon-btn.telegram:hover { border-color: rgba(0,136,204,0.45); box-shadow: 0 0 28px rgba(0,136,204,0.18); }
        .icon-btn.telegram .icon-wrap { background: linear-gradient(135deg, #29b6f6, #0277bd); box-shadow: 0 6px 22px rgba(0,136,204,0.4); }
        .icon-btn.telegram .icon-label { color: rgba(41,182,246,0.85); }

        /* ── Footer ── */
        .foot {
            margin-top: 4px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .foot i {
            color: #ff4d9e;
            font-size: 0.6rem;
            animation: heartBeat 1.6s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1);    }
            14%       { transform: scale(1.35); }
            28%       { transform: scale(1);    }
            42%       { transform: scale(1.2);  }
            56%       { transform: scale(1);    }
        }

        /* ── Floating music player ── */
        .music-float {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 8px 8px;
            background: rgba(5, 5, 8, 0.82);
            border: 1px solid rgba(255, 77, 158, 0.18);
            border-radius: 100px;
            backdrop-filter: blur(24px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,77,158,0.04);
            animation: floatIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .music-float:hover {
            border-color: rgba(255, 77, 158, 0.38);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 24px rgba(255,77,158,0.12);
        }

        .track-name {
            font-size: 0.62rem;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
            max-width: 80px;
            overflow: hidden;
            white-space: nowrap;
            mask-image: linear-gradient(to right, transparent, #000 10%, #000 80%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 80%, transparent);
        }

        .track-name.playing span {
            display: inline-block;
            animation: trackScroll 8s linear infinite;
        }

        @keyframes trackScroll {
            0%   { transform: translateX(80px); }
            100% { transform: translateX(-100%); }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-16px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* volume slider */
        .vol-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .vol-wrap:hover { opacity: 1; }

        .vol-icon {
            font-size: 0.6rem;
            color: rgba(255,77,158,0.7);
            flex-shrink: 0;
        }

        .vol-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 48px;
            height: 2px;
            border-radius: 2px;
            background: rgba(255,77,158,0.2);
            outline: none;
            cursor: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4d9e;
            box-shadow: 0 0 4px rgba(255,77,158,0.6);
            cursor: none;
        }

        .vol-slider::-moz-range-thumb {
            width: 8px;
            height: 8px;
            border: none;
            border-radius: 50%;
            background: #ff4d9e;
            box-shadow: 0 0 4px rgba(255,77,158,0.6);
            cursor: none;
        }

        .music-play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d9e, #c2185b);
            border: none;
            color: #fff;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: none;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(255,77,158,0.4);
            position: relative;
        }

        .music-play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 22px rgba(255,77,158,0.6);
        }

        .music-play-btn.spinning::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(255,77,158,0.6);
            animation: spinRing 1s linear infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }



        /* ── Click to enter overlay ── */
        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: #050508;
            cursor: none;
            transition: opacity 1s cubic-bezier(0.4,0,0.2,1), visibility 1s;
            overflow: hidden;
        }

        #enter-overlay::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,77,158,0.08) 0%, transparent 70%);
            animation: overlayBreath 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes overlayBreath {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        #enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* particles */
        .enter-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .enter-particles span {
            position: absolute;
            bottom: -10px;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #ff4d9e;
            animation: particleRise linear infinite;
            opacity: 0;
        }

        .enter-particles span:nth-child(1)  { left:10%;  animation-duration:8s;  animation-delay:0s;   width:2px;  height:2px; }
        .enter-particles span:nth-child(2)  { left:20%;  animation-duration:10s; animation-delay:1s;   width:3px;  height:3px; opacity:0.5; }
        .enter-particles span:nth-child(3)  { left:33%;  animation-duration:7s;  animation-delay:2s;   }
        .enter-particles span:nth-child(4)  { left:45%;  animation-duration:11s; animation-delay:0.5s; width:2px;  }
        .enter-particles span:nth-child(5)  { left:55%;  animation-duration:9s;  animation-delay:3s;   width:3px;  height:3px; }
        .enter-particles span:nth-child(6)  { left:67%;  animation-duration:6s;  animation-delay:1.5s; }
        .enter-particles span:nth-child(7)  { left:78%;  animation-duration:12s; animation-delay:0.8s; width:2px;  }
        .enter-particles span:nth-child(8)  { left:88%;  animation-duration:8s;  animation-delay:2.5s; width:3px;  height:3px; }
        .enter-particles span:nth-child(9)  { left:5%;   animation-duration:14s; animation-delay:4s;   }
        .enter-particles span:nth-child(10) { left:93%;  animation-duration:7s;  animation-delay:1.2s; width:2px;  }

        @keyframes particleRise {
            0%   { transform: translateY(0) scale(1);   opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }

        /* name */
        .enter-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3.5rem, 12vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 20%, #ff4d9e 60%, #c2185b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            animation: nameReveal 1s cubic-bezier(0.16,1,0.3,1) both;
            text-shadow: none;
            line-height: 1;
        }

        @keyframes nameReveal {
            from { opacity: 0; transform: translateY(24px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .enter-tagline {
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            font-weight: 500;
            position: relative;
            z-index: 1;
            margin-top: -18px;
            animation: nameReveal 1s cubic-bezier(0.16,1,0.3,1) 0.15s both;
        }

        /* enter button */
        .enter-btn {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            background: transparent;
            border: 1px solid rgba(255,77,158,0.35);
            border-radius: 100px;
            color: rgba(255,255,255,0.7);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: none;
            transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
            animation: nameReveal 1s cubic-bezier(0.16,1,0.3,1) 0.3s both;
            overflow: hidden;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 100px;
            background: linear-gradient(135deg, rgba(255,77,158,0.15), rgba(194,24,91,0.15));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .enter-btn::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 100px;
            background: linear-gradient(135deg, #ff4d9e, #c2185b);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        #enter-overlay:hover .enter-btn {
            border-color: rgba(255,77,158,0.8);
            color: #fff;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 40px rgba(255,77,158,0.2), 0 8px 32px rgba(0,0,0,0.4);
        }

        #enter-overlay:hover .enter-btn::before { opacity: 1; }

        .enter-btn i {
            font-size: 0.7rem;
            color: #ff4d9e;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }

        #enter-overlay:hover .enter-btn i {
            transform: translateX(4px);
        }

        /* ripple rings */
        .enter-ripples {
            position: absolute;
            width: 340px;
            height: 340px;
            pointer-events: none;
            z-index: 0;
        }

        .enter-ripples span {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(255,77,158,0.15);
            animation: rippleOut 3.5s ease-out infinite;
        }

        .enter-ripples span:nth-child(2) { animation-delay: 1.1s; }
        .enter-ripples span:nth-child(3) { animation-delay: 2.2s; }

        @keyframes rippleOut {
            0%   { transform: scale(0.3); opacity: 0.8; }
            100% { transform: scale(1);   opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Click to enter overlay -->
    <div id="enter-overlay">
        <div class="enter-particles">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="enter-ripples">
            <span></span><span></span><span></span>
        </div>
        <div class="enter-name">zx</div>
        <div class="enter-tagline">Im just a ZX</div>
        <button class="enter-btn">
            enter <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!-- Custom Cursor -->
    <div class="custom-cursor" id="cursor"></div>
    <div class="cursor-trail" id="cursorTrail"></div>

    <!-- Animated Background -->
    <div class="bg-animated">
        <div class="bg-gradient-1"></div>
        <div class="bg-gradient-2"></div>
        <div class="bg-gradient-3"></div>
    </div>
    <canvas id="snow-canvas"></canvas>

    <!-- Main Content -->
    <div class="profile-wrapper">
        <div class="card">
            <div class="glass-panel">

                <!-- Avatar -->
                <div class="avatar-wrapper">
                    <div class="avatar-glow"></div>
                    <div class="avatar-ring"></div>
                    <img class="avatar-img" src="pfp.webp" alt="zx">
                    <div class="status-badge"></div>
                </div>

                <!-- Name + bio -->
                <div class="name-block">
                    <div class="name-text">zx</div>
                    <div class="bio-text" id="bioText"></div>
                </div>

                <!-- Tags -->
                <div class="tags-row">
                    <span class="chip"><i class="fa-solid fa-circle"></i> online</span>
                    <span class="chip"><i class="fa-solid fa-code"></i> dev</span>
                    <span class="chip"><i class="fa-solid fa-bolt"></i> sigma</span>
                    <span class="chip"><i class="fa-solid fa-crosshairs"></i> ratting</span>
                </div>

                <!-- Divider -->
                <div class="fancy-divider"><span>connect</span></div>

                <div class="connect-row">
                    <!-- Discord -->
                    <a class="icon-btn discord" href="#">
                        <div class="icon-wrap"><i class="fa-brands fa-discord"></i></div>
                        <span class="icon-label">Discord</span>
                    </a>
                    <!-- Telegram -->
                    <a class="icon-btn telegram" href="https://t.me/sigma_zx_hi" target="_blank">
                        <div class="icon-wrap"><i class="fa-brands fa-telegram"></i></div>
                        <span class="icon-label">Telegram</span>
                    </a>
                </div>

            </div>

            <!-- Footer -->
            <div class="foot" style="margin-top:16px;">
                <i class="fa-solid fa-heart"></i> made by zx
            </div>
        </div>
    </div>

    <audio id="bgMusic" src="thingy.mp3" loop></audio>

    <!-- Floating music player -->
    <div class="music-float">
        <button class="music-play-btn" id="playBtn" onclick="toggleMusic()">
            <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <div class="track-name" id="trackName"><span>thingy.mp3</span></div>
        <div class="vol-wrap">
            <i class="fa-solid fa-volume-low vol-icon" id="volIcon"></i>
            <input class="vol-slider" id="volSlider" type="range" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <script src="profile.js"></script>
    <script>
        const audio = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');

        const volSlider = document.getElementById('volSlider');
        const volIcon = document.getElementById('volIcon');
        const enterOverlay = document.getElementById('enter-overlay');

        audio.volume = parseFloat(volSlider.value);

        enterOverlay.addEventListener('click', () => {
            enterOverlay.classList.add('hidden');
            audio.play();
            playIcon.className = 'fa-solid fa-pause';
            document.getElementById('trackName').classList.add('playing');
        });

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause';
                document.getElementById('trackName').classList.add('playing');
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
                document.getElementById('trackName').classList.remove('playing');
            }
        }

        volSlider.addEventListener('input', () => {
            const v = parseFloat(volSlider.value);
            audio.volume = v;
            if (v === 0) {
                volIcon.className = 'fa-solid fa-volume-xmark vol-icon';
            } else if (v < 0.5) {
                volIcon.className = 'fa-solid fa-volume-low vol-icon';
            } else {
                volIcon.className = 'fa-solid fa-volume-high vol-icon';
            }
        });
    </script>
    <script>        // Bio typewriter
        const bioPhrases   = ['im so sigma', 'im just a ZX', 'im just that guy'];
        let bioPhaseIdx    = 0;
        let bioCurrent     = '';
        let bioDeleting    = false;
        const bioPauseFull  = 2000;
        const bioPauseEmpty = 400;
        const bioTypeSpeed  = 85;
        const bioDelSpeed   = 50;

        function typeBio() {
            const el = document.getElementById('bioText');
            if (!el) { setTimeout(typeBio, 200); return; }
            const target = bioPhrases[bioPhaseIdx];
            if (!bioDeleting) {
                bioCurrent = target.slice(0, bioCurrent.length + 1);
                el.textContent = bioCurrent;
                if (bioCurrent === target) {
                    bioDeleting = true;
                    setTimeout(typeBio, bioPauseFull);
                } else {
                    setTimeout(typeBio, bioTypeSpeed);
                }
            } else {
                bioCurrent = bioCurrent.slice(0, -1);
                el.textContent = bioCurrent;
                if (bioCurrent === '') {
                    bioDeleting = false;
                    bioPhaseIdx = (bioPhaseIdx + 1) % bioPhrases.length;
                    setTimeout(typeBio, bioPauseEmpty);
                } else {
                    setTimeout(typeBio, bioDelSpeed);
                }
            }
        }
        typeBio();
        const typeTarget = 'zx_hi';
        const typeSpeed  = 150;
        const deleteSpeed = 100;
        const pauseFull  = 1600;
        const pauseEmpty = 500;
        let current = '';
        let deleting = false;

        function typeTitle() {
            if (!deleting) {
                current = typeTarget.slice(0, current.length + 1);
                document.title = current || '\u200b';
                if (current === typeTarget) {
                    deleting = true;
                    setTimeout(typeTitle, pauseFull);
                } else {
                    setTimeout(typeTitle, typeSpeed);
                }
            } else {
                current = current.slice(0, -1);
                document.title = current || '\u200b';
                if (current === '') {
                    deleting = false;
                    setTimeout(typeTitle, pauseEmpty);
                } else {
                    setTimeout(typeTitle, deleteSpeed);
                }
            }
        }
        typeTitle();
    </script>
</body>
</html>
